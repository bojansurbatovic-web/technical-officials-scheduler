<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F6FC4"/><stop offset="1" stop-color="#0D2F57"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- time grid -->
  <g stroke="#FFFFFF" stroke-opacity=".16" stroke-width="10">
    <line x1="232" y1="300" x2="232" y2="820"/><line x1="412" y1="300" x2="412" y2="820"/>
    <line x1="592" y1="300" x2="592" y2="820"/><line x1="772" y1="300" x2="772" y2="820"/>
  </g>
  <!-- schedule bars: swim, bike, run -->
  <rect x="170" y="372" width="330" height="96" rx="48" fill="#5AB2FF"/>
  <rect x="380" y="522" width="400" height="96" rx="48" fill="#FF8A3D"/>
  <rect x="560" y="672" width="300" height="96" rx="48" fill="#3FCB7A"/>
  <!-- stopwatch -->
  <g transform="translate(716 250)">
    <rect x="-26" y="-150" width="52" height="46" rx="12" fill="#FFFFFF"/>
    <circle r="112" fill="none" stroke="#FFFFFF" stroke-width="34"/>
    <line x1="0" y1="0" x2="0" y2="-66" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="48" y2="30" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
  </g>
</svg>
