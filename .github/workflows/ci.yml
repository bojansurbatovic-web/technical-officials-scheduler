name: Tests and build check
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Planner engine, exports and screens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Engine and exporters match the Ubuntu app (golden files)
        run: npm test
      - name: Screens at phone, tablet and desktop size
        run: |
          (python3 -m http.server 8765 --directory web &) ; sleep 1
          SHOTS=shots npm run test:ui
        env:
          PW_CHANNEL: chrome      # the runner's preinstalled Google Chrome (no apt downloads)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

  apple:
    name: Compile iPhone/iPad and Mac apps (unsigned)
    runs-on: macos-15-intel   # Intel Mac machines: the Apple-silicon ones were at capacity
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (26 or later, required by the App Store)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen generate
      - name: Build for iPhone and iPad (simulator)
        run: |
          cd apple
          set -o pipefail
          xcodebuild -project TOScheduler.xcodeproj -scheme TOScheduler-iOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../build-ios.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" 
      - name: Build for Mac
        run: |
          cd apple
          set -o pipefail
          xcodebuild -project TOScheduler.xcodeproj -scheme TOScheduler-macOS -configuration Debug \
            -destination 'generic/platform=macOS' build CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../build-mac.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-build-logs
          path: build-*.log
